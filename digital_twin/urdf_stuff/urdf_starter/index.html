<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>URDF Viewer</title>
<style>
  body { margin:0; font-family:system-ui,sans-serif; background:#1a1a1e; color:#ddd; overflow:hidden; }
  #panel { position:fixed; top:0; left:0; width:260px; max-height:100vh; overflow-y:auto;
           background:rgba(25,25,30,0.92); padding:12px; box-sizing:border-box; z-index:10; }
  #panel h3 { margin:4px 0 10px; font-size:14px; }
  #status { font-size:12px; color:#888; margin-bottom:8px; }
  #log { font-size:11px; color:#e06060; white-space:pre-wrap; margin-top:8px; }
  .joint { margin-bottom:10px; }
  .joint label { display:block; font-size:11px; margin-bottom:2px; color:#aaa; }
  .joint input { width:100%; }
  .joint .val { color:#7fc97f; }
  button { font-size:11px; margin:2px 2px 8px 0; }
</style>
</head>
<body>
<div id="panel">
  <h3>URDF Viewer</h3>
  <div id="status">loading…</div>
  <div id="bore" style="font-size:11px;color:#9ec9ff;white-space:pre-wrap;background:#12121a;border:1px solid #2a3a4a;padding:6px;margin:6px 0;border-radius:4px;min-height:14px;">bore: ctrl+click two points on an interior wall</div>
  <button id="home">Home joints</button>
  <div id="joints"></div>
  <div id="links" style="border-top:1px solid #333;margin-top:8px;padding-top:8px;"></div>
  <div id="log"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./libs/three.module.js",
    "three/examples/jsm/": "./libs/examples/jsm/",
    "urdf-loader": "./libs/urdf/URDFLoader.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { STLLoader } from 'three/examples/jsm/loaders/STLLoader.js';
import { ColladaLoader } from 'three/examples/jsm/loaders/ColladaLoader.js';
import URDFLoader from 'urdf-loader';

// ====================== CONFIG ======================
const URDF_PATH = 'Assem1.urdf';   // <-- your URDF filename (sits next to this file)
const UP_IS_Z   = true;           // URDF Z-up -> three.js Y-up (typical). false to disable.
// ====================================================

const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');
const logErr = m => { logEl.textContent += m + '\n'; console.error(m); };

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1e);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.001, 100);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 1.0));
const key = new THREE.DirectionalLight(0xffffff, 2.0); key.position.set(2,4,3); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.5); fill.position.set(-3,-2,-1); scene.add(fill);
scene.add(new THREE.GridHelper(4, 40, 0x333338, 0x28282c));
scene.add(new THREE.AxesHelper(0.3));

const manager = new THREE.LoadingManager();
const loader = new URDFLoader(manager);
loader.parseCollision = true;
loader.loadMeshCb = (path, mgr, material, onComplete) => {
  const ext = path.split('.').pop().toLowerCase();
  if (ext === 'glb' || ext === 'gltf') {
    new GLTFLoader(mgr).load(path, g => onComplete(g.scene),
      undefined, e => { logErr('glb fail: ' + path); onComplete(null, e); });
  } else if (ext === 'stl') {
    new STLLoader(mgr).load(path, geom => {
      const mat = material || new THREE.MeshStandardMaterial({ color:0x999999, roughness:0.7 });
      onComplete(new THREE.Mesh(geom, mat));
    }, undefined, e => { logErr('stl fail: ' + path); onComplete(null, e); });
  } else if (ext === 'dae') {
    new ColladaLoader(mgr).load(path, c => onComplete(c.scene),
      undefined, e => { logErr('dae fail: ' + path); onComplete(null, e); });
  } else {
    logErr('unhandled mesh type: ' + path); onComplete(null, new Error('type'));
  }
};

let robot = null;
manager.onLoad = () => { if (robot) { robot.updateMatrixWorld(true); recenter(robot); frame(robot); } };

function recenter(r) {
  const b = new THREE.Box3().setFromObject(r), c = b.getCenter(new THREE.Vector3());
  r.position.x -= c.x; r.position.z -= c.z; r.position.y -= b.min.y; // center the whole model on the origin
  r.updateMatrixWorld(true);
}

function dumpLinks(r) {
  const v = new THREE.Vector3();
  const lines = [];
  for (const [name, link] of Object.entries(r.links)) {
    link.getWorldPosition(v);
    let n = 0; link.traverse(o => { if (o.isMesh) n++; });
    lines.push(`${name}: pos(${v.x.toFixed(2)},${v.y.toFixed(2)},${v.z.toFixed(2)}) meshes=${n} vis=${link.visible}`);
  }
  console.log(lines.join('\n'));
  const box = new THREE.Box3().setFromObject(r);
  console.log('MODEL SIZE:', JSON.stringify(box.getSize(new THREE.Vector3())));
  return lines;
}

function reframe() {
  if (!robot) return;
  const box = new THREE.Box3().setFromObject(robot);
  const c = box.getCenter(new THREE.Vector3());
  const s = box.getSize(new THREE.Vector3()).length();
  camera.position.copy(c).add(new THREE.Vector3(s*0.7, s*0.5, s*0.7));
  controls.target.copy(c); controls.update();
  camera.near = s/1000; camera.far = s*100; camera.updateProjectionMatrix();
  console.log('reframed on', JSON.stringify(c), 'size', s.toFixed(3));
}
addEventListener('keydown', e => { if (e.key === 'f') reframe(); });

loader.load(URDF_PATH, r => {
  robot = r;
  if (UP_IS_Z) robot.rotation.x = -Math.PI/2;
  scene.add(robot);
  robot.traverse(o => { if (o.isURDFCollider) o.visible = false; });
  buildUI(robot);
  buildLinkToggles(robot);
  setTimeout(() => dumpLinks(robot), 200);
  statusEl.textContent =
    `links: ${Object.keys(robot.links).length}  joints: ${Object.keys(robot.joints).length}`;
}, undefined, e => logErr('URDF load failed: ' + (e.message || e)));

function frame(r) {
  const box = new THREE.Box3().setFromObject(r);
  if (box.isEmpty()) { camera.position.set(1,1,1); return; }
  const c = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3()).length();
  camera.position.copy(c).add(new THREE.Vector3(size*0.7, size*0.5, size*0.7));
  controls.target.copy(c); controls.update();
  camera.near = size/1000; camera.far = size*100; camera.updateProjectionMatrix();
}

function buildUI(r) {
  const box = document.getElementById('joints');
  box.innerHTML = '';
  for (const [name, j] of Object.entries(r.joints)) {
    if (j.jointType === 'fixed' || j.mimicJoint) continue;
    let lo = j.limit.lower, hi = j.limit.upper;
    if (!(isFinite(lo) && isFinite(hi) && lo < hi)) { lo = -Math.PI; hi = Math.PI; }
    const mid = (lo + hi) / 2;
    j.setJointValue(mid);
    const unit = j.jointType === 'prismatic' ? 'm' : 'rad';
    const div = document.createElement('div');
    div.className = 'joint';
    div.innerHTML =
      `<label>${name} <span class="val">${mid.toFixed(3)} ${unit}</span></label>
       <input type="range" min="${lo}" max="${hi}" step="${(hi-lo)/500}" value="${mid}">`;
    const s = div.querySelector('input'), v = div.querySelector('.val');
    s.addEventListener('input', () => {
      j.setJointValue(parseFloat(s.value));
      v.textContent = `${parseFloat(s.value).toFixed(3)} ${unit}`;
    });
    box.appendChild(div);
  }
}

function buildLinkToggles(r) {
  const box = document.getElementById('links');
  box.innerHTML = '<div style="font-size:11px;color:#aaa;margin-bottom:4px;">Link visibility</div>';
  const all = document.createElement('label');
  all.style.cssText = 'display:block;font-size:11px;color:#7fc97f;margin-bottom:4px;cursor:pointer;';
  all.innerHTML = '<input type="checkbox" checked> (toggle all)';
  box.appendChild(all);
  const rows = [];
  for (const [name, link] of Object.entries(r.links)) {
    // does this link have any visual mesh?
    let hasVis = false;
    link.traverse(o => { if (o.isMesh && !o.isURDFCollider) hasVis = true; });
    if (!hasVis) continue;
    const row = document.createElement('label');
    row.style.cssText = 'display:block;font-size:11px;color:#ccc;cursor:pointer;';
    row.innerHTML = `<input type="checkbox" checked> ${name}`;
    const cb = row.querySelector('input');
    cb.addEventListener('change', () => {
      link.traverse(o => { if (o.isMesh && !o.isURDFCollider) o.visible = cb.checked; });
    });
    box.appendChild(row);
    rows.push(cb);
  }
  all.querySelector('input').addEventListener('change', e => {
    rows.forEach(cb => { if (cb.checked !== e.target.checked) { cb.checked = e.target.checked; cb.dispatchEvent(new Event('change')); } });
  });
}

document.getElementById('home').onclick = () => {
  if (!robot) return;
  for (const j of Object.values(robot.joints)) j.setJointValue(0);
  document.querySelectorAll('#joints input').forEach(s => {
    s.value = THREE.MathUtils.clamp(0, +s.min, +s.max);
    s.dispatchEvent(new Event('input'));
  });
};

// ====================================================
// Raycaster implementation for click-to-identify & Axes Highlighting
// ====================================================
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let activeAxesHelper = null; // Track the currently displayed axes

window.addEventListener('click', (event) => {
  // Ignore clicks if the robot hasn't loaded or if clicking on the side panel
  if (!robot || event.clientX < 260) return; 

  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObject(robot, true);

  if (intersects.length > 0) {
    let object = intersects[0].object;
    
    // Traverse upwards through parents until we find the URDFLink
    while (object && !object.isURDFLink) {
      object = object.parent;
    }

    if (object && object.isURDFLink) {
      // 1. Update the UI Log
      const logEl = document.getElementById('log');
      logEl.style.color = '#7fc97f';
      logEl.textContent = `Selected Link: ${object.name}`;

      // 2. Remove the previous axes helper if one exists
      if (activeAxesHelper) {
        activeAxesHelper.parent.remove(activeAxesHelper);
        activeAxesHelper.dispose();
      }

      // 3. Create a new AxesHelper (size is set to 0.1 meters / 100mm)
      activeAxesHelper = new THREE.AxesHelper(0.1);
      
      // 4. Force the axes to render on top of the solid mesh so it is always visible
      activeAxesHelper.material.depthTest = false;
      activeAxesHelper.renderOrder = 1;

      // 5. Attach the axes directly to the selected link
      object.add(activeAxesHelper);
    }
  } else {
    // Optional: Clicking on empty background clears the selection
    if (activeAxesHelper) {
      activeAxesHelper.parent.remove(activeAxesHelper);
      activeAxesHelper.dispose();
      activeAxesHelper = null;
      document.getElementById('log').textContent = '';
    }
  }
});


// ====================================================
// Shift+click a link -> fit its rotation axis from mesh geometry (PCA),
// draw the axis line, and print paste-ready twin.py values.
// Non-destructive: computes & displays only.
// ====================================================
let activeAxisLine = null;

function collectLinkVertsWorld(link) {
  const pts = [];
  const v = new THREE.Vector3();
  link.traverse(o => {
    if (!o.isMesh || o.isURDFCollider) return;
    const pos = o.geometry.attributes.position;
    if (!pos) return;
    o.updateWorldMatrix(true, false);
    // sample up to ~4000 verts for speed
    const stride = Math.max(1, Math.floor(pos.count / 4000));
    for (let i = 0; i < pos.count; i += stride) {
      v.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld);
      pts.push(v.x, v.y, v.z);
    }
  });
  return pts;
}

function fitAxisPCA(flat) {
  const n = flat.length / 3;
  let cx=0, cy=0, cz=0;
  for (let i=0;i<n;i++){ cx+=flat[3*i]; cy+=flat[3*i+1]; cz+=flat[3*i+2]; }
  cx/=n; cy/=n; cz/=n;
  // covariance
  let xx=0,xy=0,xz=0,yy=0,yz=0,zz=0;
  for (let i=0;i<n;i++){
    const dx=flat[3*i]-cx, dy=flat[3*i+1]-cy, dz=flat[3*i+2]-cz;
    xx+=dx*dx; xy+=dx*dy; xz+=dx*dz; yy+=dy*dy; yz+=dy*dz; zz+=dz*dz;
  }
  xx/=n;xy/=n;xz/=n;yy/=n;yz/=n;zz/=n;
  const C = [[xx,xy,xz],[xy,yy,yz],[xz,yz,zz]];
  // power iteration for the dominant eigenvector = long axis of the part
  let vx=1,vy=1,vz=1;
  for (let it=0; it<80; it++){
    let nx=C[0][0]*vx+C[0][1]*vy+C[0][2]*vz;
    let ny=C[1][0]*vx+C[1][1]*vy+C[1][2]*vz;
    let nz=C[2][0]*vx+C[2][1]*vy+C[2][2]*vz;
    const L=Math.hypot(nx,ny,nz)||1; nx/=L;ny/=L;nz/=L;
    vx=nx;vy=ny;vz=nz;
  }
  return { center:[cx,cy,cz], dir:[vx,vy,vz] };
}

function snapAxis(d) {
  // nearest clean world axis
  const a=[Math.abs(d[0]),Math.abs(d[1]),Math.abs(d[2])];
  const k=a.indexOf(Math.max(...a));
  const s=[0,0,0]; s[k]=d[k]>=0?1:-1; return s;
}

function showAxis(link) {
  const flat = collectLinkVertsWorld(link);
  if (flat.length < 12) { setPanel(`${link.name}: no mesh verts yet (still loading?)`); return; }
  const { center, dir } = fitAxisPCA(flat);
  const snapped = snapAxis(dir);

  // draw the axis line through the part (world space), length ~ part extent
  if (activeAxisLine) { scene.remove(activeAxisLine); activeAxisLine.geometry.dispose(); }
  const box = new THREE.Box3().setFromObject(link);
  const len = box.getSize(new THREE.Vector3()).length() * 0.6;
  const c = new THREE.Vector3(...center);
  const dv = new THREE.Vector3(...dir).normalize();
  const p1 = c.clone().addScaledVector(dv, -len);
  const p2 = c.clone().addScaledVector(dv,  len);
  const g = new THREE.BufferGeometry().setFromPoints([p1, p2]);
  const m = new THREE.LineBasicMaterial({ color: 0xff3b3b, depthTest: false });
  activeAxisLine = new THREE.Line(g, m); activeAxisLine.renderOrder = 2;
  scene.add(activeAxisLine);

  // Convert world center back to this link's PARENT frame for the joint origin.
  // The joint origin lives in the parent frame; the child link's world = parent * origin.
  // Easiest paste target: give BOTH world values and (if parent is world-aligned) parent-frame.
  const parent = link.parent && link.parent.isURDFLink ? link.parent : null;
  // world center already accounts for robot.rotation.x (-90 X) since verts are world-space,
  // but twin.py works in URDF frame (Z-up). Undo the viewer's -90 X to get URDF coords:
  const cLocalP = robot.worldToLocal(new THREE.Vector3(center[0],center[1],center[2]));
  const cU = [cLocalP.x, cLocalP.y, cLocalP.z];
  const qInvP = robot.getWorldQuaternion(new THREE.Quaternion()).invert();
  const dLocalP = new THREE.Vector3(dir[0],dir[1],dir[2]).applyQuaternion(qInvP).normalize();
  const dU = [dLocalP.x, dLocalP.y, dLocalP.z];
  const dSnapU = snapAxis(dU);

  const jointName = guessJoint(link.name);
  setPanel(
    `Link: ${link.name}\n` +
    `axis (fit):  ${dU.map(x=>x.toFixed(3)).join(' ')}\n` +
    `axis (snap): ${dSnapU.join(' ')}\n` +
    `center(URDF world): ${cU.map(x=>x.toFixed(4)).join(' ')}\n\n` +
    `twin.py set-axis ${jointName} "${dSnapU.join(' ')}"\n` +
    (parent ? `# origin is in parent (${parent.name}) frame - see note` : `twin.py set-origin ${jointName} --xyz "${cU.map(x=>x.toFixed(4)).join(' ')}"`)
  );
  console.log('[axis]', link.name, 'dir(URDF)', dU, 'center(URDF)', cU);
}

// undo robot.rotation.x = -PI/2 : viewer(x,y,z) -> urdf(x,y,z).
// viewer = Rx(-90)*urdf, so urdf = Rx(+90)*viewer: (x, z, -y)
function urdfFromViewer(p){ return [ p[0], p[2], -p[1] ]; }

function guessJoint(linkName){
  // best-effort: the joint whose child is this link
  if (!robot) return linkName + '_rotation';
  for (const [jn, j] of Object.entries(robot.joints)) {
    if (j.child && j.child.name === linkName) return jn;
  }
  return linkName + '_rotation';
}

function setPanel(text){
  const el = document.getElementById('bore');
  el.textContent = text;
}

window.addEventListener('click', (event) => {
  if (!event.shiftKey) return;            // only Shift+click triggers axis fit
  if (!robot || event.clientX < 260) return;
  const m = new THREE.Vector2(
    (event.clientX/window.innerWidth)*2-1,
    -(event.clientY/window.innerHeight)*2+1);
  raycaster.setFromCamera(m, camera);
  const hits = raycaster.intersectObject(robot, true);
  if (!hits.length) return;
  let o = hits[0].object;
  while (o && !o.isURDFLink) o = o.parent;
  if (o && o.isURDFLink) showAxis(o);
}, true);   // capture phase so it runs before the identify handler


// ====================================================
// Ctrl+click TWO points on a through-hole interior wall -> derive the bore axis
// from the two inward face-normals. Non-destructive; prints twin.py values.
// ====================================================
let borePicks = [];        // {point:Vector3, normal:Vector3}
let boreMarkers = [];
let boreAxisLine = null;

function clearBore() {
  boreMarkers.forEach(m => { scene.remove(m); m.geometry.dispose(); });
  boreMarkers = [];
  borePicks = [];
  if (boreAxisLine) { scene.remove(boreAxisLine); boreAxisLine.geometry.dispose(); boreAxisLine = null; }
}

function addBoreMarker(p, color) {
  const g = new THREE.SphereGeometry(0.004, 12, 12);
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color, depthTest:false }));
  m.position.copy(p); m.renderOrder = 3; scene.add(m); boreMarkers.push(m);
}

// closest point between two lines (p1+t*d1) and (p2+s*d2); returns midpoint of the
// shortest segment = best estimate of the axis point the two radials converge on.
function lineLineMidpoint(p1, d1, p2, d2) {
  const r = p1.clone().sub(p2);
  const a = d1.dot(d1), b = d1.dot(d2), c = d2.dot(d2);
  const d = d1.dot(r), e = d2.dot(r);
  const denom = a*c - b*b;
  let t = 0, s = 0;
  if (Math.abs(denom) > 1e-9) { t = (b*e - c*d)/denom; s = (a*e - b*d)/denom; }
  const cp1 = p1.clone().addScaledVector(d1, t);
  const cp2 = p2.clone().addScaledVector(d2, s);
  return cp1.add(cp2).multiplyScalar(0.5);
}

function computeBoreAxis() {
  const [A, B] = borePicks;
  // inward radials (point from surface toward axis) = -normal
  const rA = A.normal.clone().negate().normalize();
  const rB = B.normal.clone().negate().normalize();
  // axis direction = perpendicular to both inward radials
  let axis = rA.clone().cross(rB);
  if (axis.length() < 1e-6) {
    setPanel('bore: the two picks are collinear/too close - click points farther apart around the wall');
    return;
  }
  axis.normalize();
  // centerline point: where the two inward-radial lines converge
  const center = lineLineMidpoint(A.point, rA, B.point, rB);

  // draw axis line through the bore
  if (boreAxisLine) { scene.remove(boreAxisLine); boreAxisLine.geometry.dispose(); }
  const len = A.point.distanceTo(B.point) * 2 + 0.05;
  const p1 = center.clone().addScaledVector(axis, -len);
  const p2 = center.clone().addScaledVector(axis,  len);
  const g = new THREE.BufferGeometry().setFromPoints([p1, p2]);
  boreAxisLine = new THREE.Line(g, new THREE.LineBasicMaterial({ color:0x33ff88, depthTest:false }));
  boreAxisLine.renderOrder = 2; scene.add(boreAxisLine);

  // report in URDF coords (undo viewer -90 X)
  // true URDF coords: robot.worldToLocal undoes recenter translation + the -90deg X view rotation
  const cLocal = robot.worldToLocal(center.clone());
  const cU = [cLocal.x, cLocal.y, cLocal.z];
  // direction: rotate by inverse of robot world quaternion (no translation)
  const qInv = robot.getWorldQuaternion(new THREE.Quaternion()).invert();
  const dLocal = axis.clone().applyQuaternion(qInv).normalize();
  const dU = [dLocal.x, dLocal.y, dLocal.z];
  const dSnap = snapAxis(dU);
  // radius estimate: distance from center to a pick point, perp to axis
  const toA = A.point.clone().sub(center);
  const perp = toA.clone().sub(axis.clone().multiplyScalar(toA.dot(axis)));
  const radius = perp.length();

  setPanel(
    `Bore axis (2-pick)\n` +
    `axis (fit):  ${dU.map(x=>x.toFixed(3)).join(' ')}\n` +
    `axis (snap): ${dSnap.join(' ')}\n` +
    `center(URDF): ${cU.map(x=>x.toFixed(4)).join(' ')}\n` +
    `radius: ${(radius*1000).toFixed(2)} mm\n\n` +
    `# axis direction is paste-ready:\n` +
    `set-axis <joint> "${dSnap.join(' ')}"\n` +
    `# center is URDF-world; convert to parent frame for set-origin`
  );
  console.log('[bore] center(URDF)', cU, 'axis(URDF)', dU, 'r(mm)', (radius*1000).toFixed(2));
}

window.addEventListener('click', (event) => {
  if (!event.ctrlKey) return;              // Ctrl+click = bore pick
  if (!robot || event.clientX < 260) return;
  const m = new THREE.Vector2(
    (event.clientX/window.innerWidth)*2-1,
    -(event.clientY/window.innerHeight)*2+1);
  raycaster.setFromCamera(m, camera);
  const hits = raycaster.intersectObject(robot, true);
  if (!hits.length) return;
  const hit = hits[0];
  if (!hit.face) return;
  // world-space normal at the hit
  const nWorld = hit.face.normal.clone()
    .applyNormalMatrix(new THREE.Matrix3().getNormalMatrix(hit.object.matrixWorld))
    .normalize();

  if (borePicks.length >= 2) clearBore();   // third click resets
  borePicks.push({ point: hit.point.clone(), normal: nWorld });
  addBoreMarker(hit.point, borePicks.length === 1 ? 0xffcc00 : 0xff6600);

  if (borePicks.length === 1) {
    setPanel('bore: 1st point set. Ctrl+click a 2nd point on the opposite/other side of the interior wall.');
  } else if (borePicks.length === 2) {
    computeBoreAxis();
  }
}, true);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

(function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); })();
</script>
