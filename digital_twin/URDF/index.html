<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PnP URDF Viewer</title>
<style>
  body { margin:0; font-family: system-ui, sans-serif; background:#1a1a1e; color:#ddd; overflow:hidden; }
  #panel {
    position:fixed; top:0; left:0; width:280px; max-height:100vh; overflow-y:auto;
    background:rgba(25,25,30,0.92); padding:12px; box-sizing:border-box; z-index:10;
  }
  #panel h3 { margin:4px 0 10px; font-size:14px; }
  .joint { margin-bottom:10px; }
  .joint label { display:block; font-size:11px; margin-bottom:2px; color:#aaa; }
  .joint input[type=range] { width:100%; }
  .joint .val { color:#7fc97f; }
  #log { font-size:11px; color:#e06060; white-space:pre-wrap; margin-top:10px; }
  #status { font-size:12px; color:#888; margin-bottom:8px; }
  button { margin:2px 2px 8px 0; font-size:11px; }
  #toolbar { position:fixed; top:6px; left:50%; transform:translateX(-50%); z-index:40; display:flex; gap:4px; }
  #toolbar button { margin:0; padding:3px 8px; background:rgba(25,25,30,0.92); color:#ddd;
                    border:1px solid #444; border-radius:4px; cursor:pointer; }
</style>
</head>
<body>
<div id="toolbar">
  <button id="panelBtn">Hide panel</button>
  <button id="camBtn">Hide cameras</button>
</div>
<div id="panel">
  <h3>Pick &amp; Place</h3>
  <div id="status">loading...</div>
  <div id="live" style="font-size:12px;margin-bottom:8px;color:#e0a060;">serial: disconnected</div>
  <div id="gcode-box" style="margin-bottom:10px;border-top:1px solid #333;padding-top:8px;">
    <div style="font-size:11px;color:#aaa;margin-bottom:4px;">G-code</div>
    <div style="display:flex;gap:4px;margin-bottom:4px;">
      <input id="gcode-in" type="text" placeholder="G1 X10 F1000" autocomplete="off"
             style="flex:1;font-family:monospace;font-size:12px;background:#111;color:#ddd;border:1px solid #444;padding:3px;">
      <button id="gcode-send">Send</button>
    </div>
    <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px;">
      <button data-gc="G92 X0 Y0 Z0">Set zero</button>
      <button data-gc="M211 S0">Soft-limits off</button>
      <button data-gc="M114">Where?</button>
      <button id="estop" data-gc="M112" style="color:#e06060;">STOP</button>
    </div>
    <div id="gcode-log" style="font-family:monospace;font-size:10px;color:#7a7;max-height:80px;overflow-y:auto;white-space:pre-wrap;"></div>
  </div>
  <button id="homeBtn">Rest pose (zero)</button>
  <button id="collBtn">Toggle collision (STL)</button>
  <div id="colors" style="display:none;margin-bottom:10px;border-top:1px solid #333;padding-top:8px;">
    <div style="font-size:11px;color:#aaa;margin-bottom:4px;">Part color</div>
    <div style="display:flex;gap:4px;align-items:center;">
      <select id="color-type" style="flex:1;min-width:0;font-size:11px;background:#111;color:#ddd;border:1px solid #444;"></select>
      <input id="color-pick" type="color" style="width:32px;height:22px;padding:0;border:1px solid #444;background:#111;">
    </div>
    <button id="color-reset" style="margin-top:4px;">Reset colors</button>
  </div>
  <div id="feeder" style="display:none;margin-bottom:10px;border-top:1px solid #333;padding-top:8px;">
    <div style="font-size:11px;color:#aaa;margin-bottom:4px;">Feeder</div>
    <button id="feedBtn">Feed (4 mm)</button>
    <label style="font-size:11px;"><input id="coverChk" type="checkbox" checked> Show cover plate</label>
    <div id="coverMotor" style="font-size:11px;color:#888;margin-top:2px;">cover motor: off (switch pressed)</div>
  </div>
  <div id="joints"></div>
  <div id="log"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./libs/three.module.js",
    "three/examples/jsm/": "./libs/examples/jsm/",
    "urdf-loader": "./libs/urdf/URDFLoader.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { STLLoader } from 'three/examples/jsm/loaders/STLLoader.js';
import URDFLoader from 'urdf-loader';
import { PIPManager } from './pip_cameras.js';

// ====================== CONFIG ======================
// relative to this html file (?urdf=<path> loads another); built by ../sw2urdf/build_urdf.py
const URDF_PATH = new URLSearchParams(location.search).get('urdf') || 'PickAndPlace.urdf';
// ====================================================

const logEl = document.getElementById('log');
const statusEl = document.getElementById('status');
function logErr(msg) { logEl.textContent += msg + '\n'; console.error(msg); }

// --- three.js scene ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1e);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.001, 100);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.autoClear = false;
const pip = new PIPManager(renderer);
document.body.appendChild(renderer.domElement);

// --- toolbar: hide/show the control panel and the camera sidebar (remembered per browser) ---
function uiToggle(btnId, key, label, apply, defaultOn) {
  const btn = document.getElementById(btnId);
  let on = defaultOn;
  try { const s = localStorage.getItem(key); if (s) on = s === 'on'; } catch (e) {}
  const set = v => {
    on = v; apply(v); btn.textContent = (v ? 'Hide ' : 'Show ') + label;
    try { localStorage.setItem(key, v ? 'on' : 'off'); } catch (e) {}
  };
  btn.onclick = () => set(!on);
  set(on);
}
uiToggle('panelBtn', 'pnp-ui-panel', 'panel', v => { document.getElementById('panel').style.display = v ? '' : 'none'; }, true);
uiToggle('camBtn', 'pnp-ui-cams', 'cameras', v => pip.setVisible(v), false);   // camera sidebar starts hidden
const controls = new OrbitControls(camera, renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 1.2));
const dir = new THREE.DirectionalLight(0xffffff, 2.1);
dir.position.set(2, 4, 3);
scene.add(dir);
const dir2 = new THREE.DirectionalLight(0xffffff, 0.5);
dir2.position.set(-3, -2, -1);
scene.add(dir2);
scene.add(new THREE.GridHelper(4, 40, 0x333338, 0x28282c));
scene.add(new THREE.AxesHelper(0.3));

// --- per-part-type colors (from the part_types.json next to the URDF) ---
// Meshes are named "pt_<index>#<n>" by sw2urdf; every part of one type shares one material.
const URDF_DIR = URDF_PATH.includes('/') ? URDF_PATH.slice(0, URDF_PATH.lastIndexOf('/') + 1) : '';
const PART_TYPES = await fetch(URDF_DIR + 'part_types.json').then(r => r.ok ? r.json() : null).catch(() => null);
const COLOR_KEY = 'pnp-part-colors:' + URDF_PATH;
let savedColors = {};
try { savedColors = JSON.parse(localStorage.getItem(COLOR_KEY)) || {}; } catch (e) {}
const partMats = (PART_TYPES || []).map(t =>
  new THREE.MeshStandardMaterial({ color: savedColors[t.name] || t.color, metalness: 0.2, roughness: 0.6 }));
const partMeshes = [];   // part type index -> loaded meshes
const COVER_TYPE = (PART_TYPES || []).findIndex(t => t.name === 'base_cover');   // feeder cover plate
document.getElementById('coverChk').onchange = e => {
  (partMeshes[COVER_TYPE] || []).forEach(m => { m.visible = e.target.checked; });
};
function partTypeIndex(o) {
  for (let p = o; p; p = p.parent) { const m = /^pt_(\d+)/.exec(p.name || ''); if (m) return +m[1]; }
  return -1;
}
if (PART_TYPES) {
  const sel = document.getElementById('color-type'), pick = document.getElementById('color-pick');
  // one <optgroup> per group: "All <group>" recolors every member, then the individual part types
  const groups = new Map();
  PART_TYPES.forEach((t, i) => {
    const g = t.group || 'Parts';
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(i);
  });
  for (const [g, idx] of groups) {
    const og = document.createElement('optgroup'); og.label = g;
    og.appendChild(new Option(`All ${g.toLowerCase()} (${idx.reduce((n, i) => n + PART_TYPES[i].count, 0)})`, 'g:' + g));
    idx.forEach(i => og.appendChild(new Option(`${PART_TYPES[i].name} (${PART_TYPES[i].count})`, i)));
    sel.appendChild(og);
  }
  const members = () => sel.value.startsWith('g:') ? groups.get(sel.value.slice(2)) : [+sel.value];
  const show = () => { pick.value = '#' + partMats[members()[0]].color.getHexString(); };
  const save = () => { try { localStorage.setItem(COLOR_KEY, JSON.stringify(savedColors)); } catch (e) {} };
  sel.onchange = show;
  pick.oninput = () => {
    for (const i of members()) { partMats[i].color.set(pick.value); savedColors[PART_TYPES[i].name] = pick.value; }
    save();
  };
  document.getElementById('color-reset').onclick = () => {
    PART_TYPES.forEach((t, i) => partMats[i].color.set(t.color));
    savedColors = {}; save(); show();
  };
  show();
  document.getElementById('colors').style.display = '';
}

// --- URDF loading with explicit glb + stl support ---
const manager = new THREE.LoadingManager();
const loader = new URDFLoader(manager);
loader.parseCollision = true;   // load collision (STL) too, hidden by default
loader.loadMeshCb = (path, manager, material, onComplete) => {
  const ext = path.split('.').pop().toLowerCase();
  if (ext === 'glb' || ext === 'gltf') {
    new GLTFLoader(manager).load(path,
      g => {
        // SolidWorks glb exports often ship metalness=1; pure metals ignore
        // ambient light entirely in PBR, which makes off-angle (PIP) views
        // render dark no matter how much fill light is added. Clamp so the
        // materials keep a diffuse response.
        g.scene.traverse(o => {
          if (!o.isMesh || !o.material) return;
          const mats = Array.isArray(o.material) ? o.material : [o.material];
          mats.forEach(m => {
            if (m.metalness !== undefined) m.metalness = Math.min(m.metalness, 0.35);
            if (m.roughness !== undefined) m.roughness = Math.max(m.roughness, 0.45);
          });
          const k = partTypeIndex(o);
          if (k >= 0 && partMats[k]) {
            o.material = partMats[k];
            (partMeshes[k] ||= []).push(o);
            if (k === COVER_TYPE) o.visible = document.getElementById('coverChk').checked;
          }
        });
        onComplete(g.scene);
      },
      undefined,
      e => { logErr(`FAILED glb: ${path}\n${e.message || e}`); onComplete(null, e); });
  } else if (ext === 'stl') {
    new STLLoader(manager).load(path,
      geom => {
        const mat = material || new THREE.MeshStandardMaterial({ color: 0x999999, roughness: 0.7 });
        onComplete(new THREE.Mesh(geom, mat));
      },
      undefined,
      e => { logErr(`FAILED stl: ${path}\n${e.message || e}`); onComplete(null, e); });
  } else {
    logErr(`Unhandled mesh type: ${path}`);
    onComplete(null, new Error('unhandled type'));
  }
};

let robot = null;
manager.onLoad = () => {
  if (!robot) return;
  robot.updateMatrixWorld(true);
  recenterOnGround(robot);
  frameRobot(robot);
};
loader.load(URDF_PATH, r => {
  robot = r;
  if (new URLSearchParams(location.search).has('debug')) Object.assign(window, { robot, camera, controls });   // console inspection
  robot.rotation.x = -Math.PI / 2;   // URDF Z-up -> three.js Y-up
  scene.add(robot);
  
  pip.attachCameras(robot, "toolhead_carriage", "z1_mount", "feeder_servo_arm", "feeder_tension_lever");

  robot.traverse(o => { if (o.isURDFCollider) o.visible = false; });

  buildJointUI(robot);
  if (robot.joints.feeder_servo_joint) {
    document.getElementById('feeder').style.display = '';
    robot.joints.feeder_tape_joint.setJointValue(0); syncSlider('feeder_tape_joint', 0);
    robot.joints.feeder_tension_lever_joint.setJointValue(0);    // taut cover tape: switch pressed, motor off
    syncSlider('feeder_tension_lever_joint', 0);                 // slider kept so the lever can be swung by hand
    for (const n of ['feeder_rod_joint', 'feeder_advancer_joint'])   // driven by the servo linkage, no slider
      document.querySelector(`input[data-joint="${n}"]`)?.closest('.joint').remove();
    feederPose(FEEDER.RETRACT);   // idle between picks: lever retracted
    // dragging the servo slider moves the piston rod and lever with it
    document.querySelector('input[data-joint="feeder_servo_joint"]')
      .addEventListener('input', e => feederPose(parseFloat(e.target.value) * 180 / Math.PI + 90));
  }
  connectSerial(robot);
  statusEl.textContent =
    `links: ${Object.keys(robot.links).length}, joints: ${Object.keys(robot.joints).length}`;
}, undefined, e => logErr(`FAILED urdf: ${e.message || e}`));

function recenterOnGround(r) {
  const box = new THREE.Box3();
  r.traverse(o => {
    if (!o.isMesh) return;
    let p = o, isColl = false;
    while (p) { if (p.isURDFCollider) { isColl = true; break; } p = p.parent; }
    if (!isColl) box.expandByObject(o);
  });
  if (box.isEmpty()) return;
  const c = box.getCenter(new THREE.Vector3());
  r.position.x -= c.x;
  r.position.z -= c.z;
  r.position.y -= box.min.y;
  r.updateMatrixWorld(true);
}

function frameRobot(r) {
  const box = new THREE.Box3().setFromObject(r);
  if (box.isEmpty()) { camera.position.set(1,1,1); return; }
  const c = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3()).length();
  camera.position.copy(c).add(new THREE.Vector3(size*0.7, size*0.5, size*0.7));
  controls.target.copy(c);
  controls.update();
  camera.near = size/1000; camera.far = size*100;
  camera.updateProjectionMatrix();
}

function buildJointUI(r) {
  const box = document.getElementById('joints');
  box.innerHTML = '';
  for (const [name, j] of Object.entries(r.joints)) {
    if (j.jointType === 'fixed') continue;
    if (j.mimicJoint) continue;
    let lo = j.limit.lower, hi = j.limit.upper;
    if (!(isFinite(lo) && isFinite(hi) && lo < hi)) { lo = -Math.PI; hi = Math.PI; }
    const div = document.createElement('div');
    div.className = 'joint';
    const unit = j.jointType === 'prismatic' ? 'm' : 'rad';
    const mid = (lo + hi) / 2;
    j.setJointValue(mid);
    div.innerHTML = `<label>${name} (${j.jointType}) <span class="val">${mid.toFixed(3)} ${unit}</span></label>
      <input type="range" data-joint="${name}" min="${lo}" max="${hi}" step="${(hi-lo)/500}" value="${mid}">`;
    const slider = div.querySelector('input');
    const val = div.querySelector('.val');
    slider.addEventListener('input', () => {
      j.setJointValue(parseFloat(slider.value));
      val.textContent = `${parseFloat(slider.value).toFixed(3)} ${unit}`;
    });
    box.appendChild(div);
  }
}

// ---- 0816 feeder (mgrl 0816-feeder-firmware) ----
// Servo angle A in degrees; the URDF joint is A - 90 (CAD pose = fully advanced). Slider-crank: the rod pivots
// on the horn hole, its front hole (feeder_rod_front marker) is pinned to the pin lever, which slides along the
// tape. The pin carries the tape only on the last pitch of the advance stroke (15 -> 90 deg); on retract it
// slides back to the next sprocket hole.
// M600 [F<mm>] feeds and stays advanced, M601 retracts, M603 A<deg> sets the angle (config.h defaults).
// Cover tape: advancing the carrier tape gives the cover tape slack, the spring tips the tension lever off the
// microswitch and the N20 runs; the gears wind the slack in until the taut tape tips the lever back onto the switch.
const FEEDER = { ADVANCED: 90, RETRACT: 15, SETTLE_MS: 240, PITCH: 0.004,
                 GEAR_R: 0.006,           // m, 17T module 0.7 pitch radius: cover tape wound per gear radian
                 // from mgrl's 0816-feeder-actuating.mp4: the arm jumps ~0.14 rad as the servo stroke ends, then
                 // the gears wind it back down over ~0.4 s and stop
                 WIND_SPEED: 0.01,        // m/s of cover tape while the motor runs (4 mm in ~0.4 s)
                 LEVER_PER_M: -0.14 / 0.004 };   // rad of lever release per m of slack
const feeder = { angle: FEEDER.ADVANCED, tape: 0, slack: 0, winding: false, queue: Promise.resolve(), rodLen: null };
function feederLever() {
  const j = robot.joints.feeder_tension_lever_joint;
  j.setJointValue(Math.max(j.limit.lower, feeder.slack * FEEDER.LEVER_PER_M));
  syncSlider('feeder_tension_lever_joint', j.angle);
  document.getElementById('coverMotor').textContent = feeder.slack > 0 ? 'cover motor: on' : 'cover motor: off (switch pressed)';
}
// N20 runs while the switch is open, independent of the servo (it has its own feedback line)
function feederWind() {
  if (feeder.winding) return;
  feeder.winding = true;
  const spool = robot.joints.feeder_spool_drive_joint;
  let last = performance.now();
  (function step(now) {
    const wound = Math.min(feeder.slack, FEEDER.WIND_SPEED * (now - last) / 1000); last = now;
    feeder.slack -= wound;
    spool.setJointValue(spool.angle + wound / FEEDER.GEAR_R); syncSlider('feeder_spool_drive_joint', spool.angle);
    feederLever();
    if (feeder.slack > 1e-6) requestAnimationFrame(step);
    else { feeder.slack = 0; feederLever(); feeder.winding = false; }
  })(last);
}
const deg = d => d * Math.PI / 180;
function syncSlider(name, v) {
  const s = document.querySelector(`input[data-joint="${name}"]`);
  if (!s) return;
  s.value = v;
  const lab = s.parentElement.querySelector('.val');
  if (lab) lab.textContent = `${v.toFixed(3)} ${robot.joints[name].jointType === 'prismatic' ? 'm' : 'rad'}`;
}
// put the servo at angle A, slide the pin lever to where the rod length allows, and swing the rod onto it;
// returns the lever position along the tape (0 = fully advanced, negative = pulled back)
function feederPose(A) {
  const js = robot.joints, servo = js.feeder_servo_joint, rodJ = js.feeder_rod_joint, adv = js.feeder_advancer_joint;
  const rod = robot.links.feeder_rod, front = robot.links.feeder_rod_front, base = adv.parent;
  const wp = o => o.getWorldPosition(new THREE.Vector3());
  const q = THREE.MathUtils.clamp(deg(A - 90), servo.limit.lower, servo.limit.upper);
  servo.setJointValue(q); rodJ.setJointValue(0); robot.updateMatrixWorld(true);
  if (feeder.rodLen === null) feeder.rodLen = wp(front).distanceTo(wp(rod));
  // lever pin F = F0 + s*u on its line; solve |F - H| = rod length (H = horn hole), taking the forward root
  const H = base.worldToLocal(wp(rod)), F0 = adv.origPosition, u = adv.axis.clone().normalize();
  const d = F0.clone().sub(H), b = d.dot(u);
  const s = THREE.MathUtils.clamp(-b + Math.sqrt(Math.max(0, b * b - d.lengthSq() + feeder.rodLen ** 2)),
                                  adv.limit.lower, adv.limit.upper);
  adv.setJointValue(s);
  // rod angle: turn the rod about its pivot until its front hole points at the lever pin
  const Hw = wp(rod), v0 = wp(front).sub(Hw), v = base.localToWorld(F0.clone().addScaledVector(u, s)).sub(Hw);
  const n = rodJ.axis.clone().transformDirection(rod.matrixWorld);
  rodJ.setJointValue(Math.atan2(v0.clone().cross(v).dot(n), v0.dot(v)));
  syncSlider('feeder_servo_joint', q);
  feeder.angle = A;
  return s;
}
function feederSetTape() {
  const t = feeder.tape % FEEDER.PITCH;   // tape holes repeat every pitch, so wrap the stub
  robot.joints.feeder_tape_joint.setJointValue(t); syncSlider('feeder_tape_joint', t);
}
// sweep the servo to angle A at the firmware's settle speed; the tape and cover-tape spool follow the pin
function feederMove(A) {
  return new Promise(resolve => {
    const A0 = feeder.angle, ms = Math.max(60, FEEDER.SETTLE_MS * Math.abs(A - A0) / (FEEDER.ADVANCED - FEEDER.RETRACT));
    const t0 = performance.now();
    let prev = feederPose(A0);
    (function step(now) {
      const s = Math.min(1, (now - t0) / ms), e = s * s * (3 - 2 * s);
      const a = feederPose(A0 + (A - A0) * e);
      const push = Math.max(0, a - Math.max(prev, -FEEDER.PITCH));   // forward travel inside the last pitch
      if (push > 0) { feeder.tape += push; feeder.slack += push; feederLever(); }
      feederSetTape(); prev = a;
      if (s < 1) requestAnimationFrame(step);
      else { if (feeder.slack > 0) feederWind(); resolve(); }   // motor winds once the stroke has made the slack
    })(t0);
  });
}
function feederCommand(num, w) {
  const run = async () => {
    if (num === 600) {
      const n = Math.max(1, Math.round((w.F || FEEDER.PITCH * 1000) / (FEEDER.PITCH * 1000)));
      for (let i = 0; i < n; i++) {
        if (feeder.angle > FEEDER.RETRACT) await feederMove(FEEDER.RETRACT);
        await feederMove(FEEDER.ADVANCED);
      }
    } else if (num === 601) await feederMove(FEEDER.RETRACT);
    else if (num === 603) await feederMove(THREE.MathUtils.clamp(w.A ?? 90, 0, 180));
  };
  return (feeder.queue = feeder.queue.then(run));
}
const isFeederCode = up => /^M60[0-3]\b|^M6[12]0\b/.test(up);
document.getElementById('feedBtn').onclick = () => {   // one pick cycle: feed, then retract
  if (!robot || !robot.joints.feeder_servo_joint) return;
  feederCommand(600, {}); feederCommand(601, {});
};

document.getElementById('homeBtn').onclick = () => {
  if (!robot) return;
  for (const j of Object.values(robot.joints)) j.setJointValue(0);
  document.querySelectorAll('#joints input').forEach(s => {
    s.value = THREE.MathUtils.clamp(0, parseFloat(s.min), parseFloat(s.max));
    s.dispatchEvent(new Event('input'));
  });
};

let collVisible = false;
document.getElementById('collBtn').onclick = () => {
  if (!robot) return;
  collVisible = !collVisible;
  robot.traverse(o => { if (o.isURDFCollider) o.visible = collVisible; });
};

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---- live serial link + standalone G-code simulator ----
function connectSerial(robot) {
  const liveEl = document.getElementById('live');
  const WS_URL = 'ws://' + (location.hostname || 'localhost') + ':8765';
  let ws;

  // one source of truth for kinematics (must match sw2urdf/build_urdf.py and serial_bridge.py)
  const X_LEAD = 8.0;    // mm per lead-screw rev
  const ACCEL = 3000.0;  // mm/s^2, mirror of firmware M201

  function setLive(txt, color) { liveEl.textContent = 'serial: ' + txt; liveEl.style.color = color; }
  const logEl = document.getElementById('gcode-log');
  function gcodeLog(t) { logEl.textContent += t + '\n'; logEl.scrollTop = logEl.scrollHeight; }

  // ---------- local machine simulator ----------
  const sim = {
    pos: { X: 0, Y: 0, Z: 0, E: 0 },   // logical position, mm
    absolute: true,
    feed: 1000,            // mm/min
    queue: [],
    busy: false,
  };

  // X: lead screws (radians); Y: belt carriage and Z1: prismatic (meters). The gantry, Z2 and the
  // pulleys follow through URDF mimics. E has no joint (the feeder runs on its own controller).
  function applyJoints(xmm, ymm, emm, zmm) {
    const jls = robot.joints["leadscrew_l_joint"];
    const jtc = robot.joints["toolhead_carriage_joint"];
    const jz1 = robot.joints["z1_joint"];
    if (jls) jls.setJointValue(xmm * (2 * Math.PI / X_LEAD));
    if (jtc) jtc.setJointValue(ymm * 0.001);
    if (jz1 && zmm !== undefined) jz1.setJointValue(zmm * 0.001);
  }

  function parseWords(line) {
    const out = {};
    const re = /([A-Za-z])(-?\d+\.?\d*)/g;
    let m;
    while ((m = re.exec(line)) !== null) out[m[1].toUpperCase()] = parseFloat(m[2]);
    return out;
  }

  function enqueue(line) { sim.queue.push(line); pump(); }
  function pump() {
    if (sim.busy) return;
    const line = sim.queue.shift();
    if (line === undefined) return;
    sim.busy = true;
    executeLine(line, () => { sim.busy = false; pump(); });
  }

  function executeLine(line, done) {
    const up = line.toUpperCase().trim();
    const w = parseWords(up);
    const code = up.match(/^[GM]\d+/) ? up.match(/^([GM])(\d+)/) : null;
    if (!code) { done(); return; }
    const letter = code[1], num = parseInt(code[2]);

    if (letter === 'G') {
      if (num === 90) { sim.absolute = true; done(); return; }
      if (num === 91) { sim.absolute = false; done(); return; }
      if (num === 92) {
        if (w.X !== undefined) sim.pos.X = w.X;
        if (w.Y !== undefined) sim.pos.Y = w.Y;
        if (w.E !== undefined) sim.pos.E = w.E;
        if (w.Z !== undefined) sim.pos.Z = w.Z;
        applyJoints(sim.pos.X, sim.pos.Y, sim.pos.E, sim.pos.Z);
        done(); return;
      }
      if (num === 4) { setTimeout(done, (w.P || 0) + (w.S || 0) * 1000); return; }
      if (num === 0 || num === 1 || num === 2 || num === 3) {
        if (w.F !== undefined) sim.feed = w.F;
        const sx = sim.pos.X, sy = sim.pos.Y;
        const tx = w.X !== undefined ? (sim.absolute ? w.X : sx + w.X) : sx;
        const ty = w.Y !== undefined ? (sim.absolute ? w.Y : sy + w.Y) : sy;
        const se = sim.pos.E;
        const te = w.E !== undefined ? (sim.absolute ? w.E : se + w.E) : se;
        const sz = sim.pos.Z;
        const tz = w.Z !== undefined ? (sim.absolute ? w.Z : sz + w.Z) : sz;

        let pathFn, length;
        if (num <= 1) {                                  // straight
          const dx = tx - sx, dy = ty - sy;
          length = Math.hypot(dx, dy);
          pathFn = s => [sx + dx * (s / length), sy + dy * (s / length)];
        } else {                                         // arc G2 (CW) / G3 (CCW)
          const cx = sx + (w.I || 0), cy = sy + (w.J || 0);
          const r = Math.hypot(sx - cx, sy - cy);
          const a0 = Math.atan2(sy - cy, sx - cx);
          let a1 = Math.atan2(ty - cy, tx - cx);
          let dA = a1 - a0;
          if (num === 2) { if (dA >= -1e-9) dA -= 2 * Math.PI; }   // CW: negative sweep
          else           { if (dA <=  1e-9) dA += 2 * Math.PI; }   // CCW: positive sweep
          length = Math.abs(dA) * r;
          pathFn = s => {
            const a = a0 + dA * (s / length);
            return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
          };
        }

        if (!isFinite(length) || length < 1e-6) {
          const dEZ = Math.max(Math.abs(te - se), Math.abs(tz - sz));
          if (dEZ > 1e-9) {          // E/Z-only move (dispense or plunge in place)
            const eT = dEZ / Math.max(sim.feed / 60.0, 0.1) * 1000;
            const e0 = performance.now();
            (function estep(){
              const f = Math.min((performance.now() - e0) / eT, 1);
              applyJoints(sim.pos.X, sim.pos.Y, se + (te - se) * f, sz + (tz - sz) * f);
              if (f < 1) requestAnimationFrame(estep);
              else { sim.pos.E = te; sim.pos.Z = tz; done(); }
            })();
            return;
          }
          sim.pos.X = tx; sim.pos.Y = ty; applyJoints(tx, ty, sim.pos.E, sim.pos.Z); done(); return;
        }

        // trapezoidal profile along path length
        const vMax = Math.max(sim.feed / 60.0, 0.1);
        const tA = vMax / ACCEL, dA_ = 0.5 * ACCEL * tA * tA;
        let totalT, cruiseT, peakV;
        if (length < 2 * dA_) {
          const tHalf = Math.sqrt(length / ACCEL);
          totalT = 2 * tHalf; cruiseT = 0; peakV = ACCEL * tHalf;
        } else {
          cruiseT = (length - 2 * dA_) / vMax;
          totalT = 2 * tA + cruiseT; peakV = vMax;
        }
        const t0 = performance.now();
        (function step() {
          const t = (performance.now() - t0) / 1000;
          if (t >= totalT) { sim.pos.X = tx; sim.pos.Y = ty; sim.pos.E = te; sim.pos.Z = tz; applyJoints(tx, ty, te, tz); done(); return; }
          let s;
          if (cruiseT === 0) {
            const th = totalT / 2;
            s = t <= th ? 0.5 * ACCEL * t * t
                        : length - 0.5 * ACCEL * (totalT - t) * (totalT - t);
          } else {
            if (t <= tA) s = 0.5 * ACCEL * t * t;
            else if (t <= tA + cruiseT) s = dA_ + vMax * (t - tA);
            else { const td = totalT - t; s = length - 0.5 * ACCEL * td * td; }
          }
          const sc = Math.min(Math.max(s, 0), length);
          const [x, y] = pathFn(sc);
          applyJoints(x, y, se + (te - se) * (sc / length), sz + (tz - sz) * (sc / length));
          requestAnimationFrame(step);
        })();
        return;
      }
      done(); return;                                    // other G: no-op
    }
    // feeder M-codes (0816 firmware) animate the feeder; other M-codes have no kinematic effect in the sim
    if (isFeederCode(up) && robot.joints.feeder_servo_joint) { feederCommand(num, w).then(done); return; }
    done();
  }

  // ---------- command entry ----------
  function sendGcode(line) {
    const connected = ws && ws.readyState === WebSocket.OPEN;
    const up = line.toUpperCase();
    if (isFeederCode(up.trim())) {
      // the feeder has its own controller; never forward these to the RAMBo (Marlin M600 = filament change)
      gcodeLog('> ' + line + ' (feeder, sim)');
    } else if (connected) {
      if (/^G[0-3]\b/.test(up)) ws.send(JSON.stringify({ gcode: [line, "M400", "M114"] }));
      else ws.send(JSON.stringify({ gcode: line }));
      gcodeLog('> ' + line);
    } else {
      gcodeLog('> ' + line + ' (sim)');
    }
    enqueue(line);                                        // always drive the twin locally
  }

  // wire UI once
  const inEl = document.getElementById('gcode-in');
  document.getElementById('gcode-send').onclick = () => { if (inEl.value.trim()) { sendGcode(inEl.value.trim()); inEl.value=''; } };
  inEl.addEventListener('keydown', e => { if (e.key === 'Enter' && inEl.value.trim()) { sendGcode(inEl.value.trim()); inEl.value=''; } });
  document.querySelectorAll('#gcode-box button[data-gc]').forEach(b => {
    b.onclick = () => sendGcode(b.getAttribute('data-gc'));
  });

  function open() {
    ws = new WebSocket(WS_URL);
    ws.onopen = () => setLive('connected', '#7fc97f');
    ws.onclose = () => { setLive('standalone (sim)', '#e0a060'); setTimeout(open, 3000); };
    ws.onerror = () => ws.close();
    ws.onmessage = (ev) => {
      let data; try { data = JSON.parse(ev.data); } catch { return; }
      if (data.ack) { gcodeLog((data.ack.ok ? '  ok ' : '  ERR ') + data.ack.cmd); return; }
      if (!data.joints || sim.busy) return;   // hardware truth wins when sim is idle
      for (const [name, val] of Object.entries(data.joints)) {
        const j = robot.joints[name];
        if (!j) continue;
        j.setJointValue(val);
        if (name === "leadscrew_l_joint") sim.pos.X = val * (X_LEAD / (2 * Math.PI));
        if (name === "toolhead_carriage_joint") sim.pos.Y = val * 1000;
        if (name === "z1_joint") sim.pos.Z = val * 1000;
        const s = document.querySelector(`input[data-joint="${name}"]`);
        if (s) {
          s.value = val;
          const lab = s.parentElement.querySelector('.val');
          const unit = j.jointType === 'prismatic' ? 'm' : 'rad';
          if (lab) lab.textContent = val.toFixed(3) + ' ' + unit;
        }
      }
    };
  }
  open();
}

(function animate(){
    requestAnimationFrame(animate); 
    controls.update(); 
    
    renderer.clear();

    renderer.setViewport(0,0,innerWidth, innerHeight);
    renderer.setScissorTest(false);
    renderer.render(scene, camera);

    if(robot) pip.render(scene, innerWidth, innerHeight);
    })();
</script>
</body>
</html>
