<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Schedule</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0F1117; }
    #root { min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef, useEffect, useMemo, useCallback } = React;

    const DAY = 86400000;
    const DEFAULT_START = Date.UTC(2026, 3, 6);
    const DEFAULT_END = Date.UTC(2026, 10, 30);

    const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    function fmtDate(ts) { const d = new Date(ts); return MONTHS[d.getUTCMonth()] + " " + d.getUTCDate(); }
    function fmtRange(s, e) { return s === e ? fmtDate(s) : fmtDate(s) + " \u2014 " + fmtDate(e); }
    function daysCount(s, e) { return Math.max(1, Math.round((e - s) / DAY)); }

    const SCHEDULE_FILES = [
      'solder_dispensing.csv',
      'file_handling.csv',
      'component_dispensing.csv',
      'gantry_system.csv',
      'power_supply.csv',
      'main_pcb.csv'
    ];

    function GanttChart() {
      const [categories, setCategories] = useState([]);
      const [projectStart, setProjectStart] = useState(DEFAULT_START);
      const [projectEnd, setProjectEnd] = useState(DEFAULT_END);
      const [loadingError, setLoadingError] = useState(null);
      
      const [collapsed, setCollapsed] = useState({});
      const [viewStart, setViewStart] = useState(DEFAULT_START);
      const [viewEnd, setViewEnd] = useState(DEFAULT_END);
      const [tooltip, setTooltip] = useState(null);
      const [isDragging, setIsDragging] = useState(false);
      const [dragState, setDragState] = useState(null);
      const navRef = useRef(null);

      const totalSpan = projectEnd - projectStart;
      const toggle = (id) => setCollapsed((p) => {const n = {...p}; n[id] = !n[id]; return n;});

      // Parse array of CSV text contents into timeline format
      const parseCSVData = useCallback((textArray) => {
        let loadedCategories = [];
        const colors = ["#E8590C", "#1971C2", "#2F9E44", "#9C36B5", "#E67700", "#C92A2A", "#F03E3E", "#1098AD"];

        textArray.forEach((text, index) => {
          if (!text) return;
          const lines = text.split('\n').map(l => l.trim()).filter(l => l);
          
          if (lines.length >= 2) {
            const headerParts = lines[0].split(',').map(p => p.trim());
            const label = headerParts[0];
            const owner = headerParts[1] || "Team";
            const id = label.toLowerCase().replace(/\s+/g, '-');
            const color = colors[loadedCategories.length % colors.length];

            const tasks = [];
            for (let i = 1; i < lines.length; i++) {
              const parts = lines[i].split(',').map(p => p.trim());
              if (parts.length < 2) continue;

              const dateStr = parts[0];
              const taskName = parts[1];

              if (taskName.toUpperCase() === 'TBD') continue;

              const [y, m, d] = dateStr.split('-');
              if (!y || !m || !d) continue;

              const startTs = Date.UTC(parseInt(y), parseInt(m) - 1, parseInt(d));
              const endTs = startTs + (6 * DAY); // Span Mon-Sun

              tasks.push({
                name: taskName,
                start: startTs,
                end: endTs
              });
            }

            if (tasks.length > 0) {
              loadedCategories.push({ id, label, owner, color, tasks });
            }
          }
        });

        if (loadedCategories.length > 0) {
          const allTasks = loadedCategories.flatMap(c => c.tasks);
          const minStart = Math.min(...allTasks.map(t => t.start));
          const maxEnd = Math.max(...allTasks.map(t => t.end));
          setProjectStart(minStart);
          setProjectEnd(maxEnd);
          setViewStart(minStart);
          setViewEnd(maxEnd);
          setCategories(loadedCategories);
          setLoadingError(null);
        }
      }, []);

      // Auto-fetch files on mount
      useEffect(() => {
        Promise.all(
          SCHEDULE_FILES.map(file =>
            fetch(new URL(file, document.baseURI))
              .then(res => {
                if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                return res.text();
              })
              .catch(e => {
                console.warn(`Could not load ${file}:`, e);
                return null;
              })
          )
        ).then(texts => {
          const validTexts = texts.filter(t => t !== null);
          if (validTexts.length > 0) {
            parseCSVData(validTexts);
          } else {
            setLoadingError("Could not load schedule files. Verify they exist in the /schedules/ directory.");
          }
        });
      }, [parseCSVData]);

      var toPercent = useCallback(function(ts) {
        return ((ts - viewStart) / (viewEnd - viewStart)) * 100;
      }, [viewStart, viewEnd]);

      var navToPercent = function(ts) { return ((ts - projectStart) / totalSpan) * 100; };

      var barGeo = useCallback(function(s, e) {
        var rawL = toPercent(s);
        var rawR = toPercent(e);
        if (rawR < 0 || rawL > 100) return null;
        var l = Math.max(0, rawL);
        var r = Math.min(100, rawR);
        return { left: l, width: Math.max(0.3, r - l) };
      }, [toPercent]);

      var rows = useMemo(function() {
        var r = [];
        categories.forEach(function(cat) {
          r.push({ type: "header", cat: cat });
          if (!collapsed[cat.id]) {
            cat.tasks.forEach(function(t) { r.push({ type: "task", task: t, cat: cat }); });
          }
        });
        return r;
      }, [categories, collapsed]);

      var monthLines = useMemo(function() {
        var lines = [];
        var d = new Date(projectStart);
        d.setUTCDate(1);
        while (d.getTime() <= projectEnd + DAY * 31) {
          var ts = d.getTime();
          if (ts >= viewStart - DAY * 5 && ts <= viewEnd + DAY * 5) {
            lines.push({ ts: ts, label: MONTHS[d.getUTCMonth()] + " " + d.getUTCFullYear() });
          }
          d = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1));
        }
        return lines;
      }, [viewStart, viewEnd, projectStart, projectEnd]);

      var now = Date.now();
      var todayPct = toPercent(now);
      var showToday = now >= viewStart && now <= viewEnd;

      var handleNavMouseDown = function(e) {
        if (categories.length === 0) return;
        var rect = navRef.current.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var pct = x / rect.width;
        var clickTs = projectStart + pct * totalSpan;
        var winStartPx = (navToPercent(viewStart) / 100) * rect.width;
        var winEndPx = (navToPercent(viewEnd) / 100) * rect.width;
        if (x >= winStartPx && x <= winEndPx) {
          setIsDragging(true);
          setDragState({ type: "pan", offsetTs: clickTs - viewStart });
        } else {
          var span = viewEnd - viewStart;
          var newStart = Math.max(projectStart, Math.min(clickTs - span / 2, projectEnd - span));
          setViewStart(newStart);
          setViewEnd(newStart + span);
        }
      };

      useEffect(function() {
        if (!isDragging || categories.length === 0) return;
        var onMove = function(e) {
          var rect = navRef.current.getBoundingClientRect();
          var x = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
          var pct = x / rect.width;
          var ts = projectStart + pct * totalSpan;
          var span = viewEnd - viewStart;
          if (dragState && dragState.type === "pan") {
            var newStart = ts - dragState.offsetTs;
            newStart = Math.max(projectStart, Math.min(newStart, projectEnd - span));
            setViewStart(newStart);
            setViewEnd(newStart + span);
          }
        };
        var onUp = function() { setIsDragging(false); setDragState(null); };
        window.addEventListener("mousemove", onMove);
        window.addEventListener("mouseup", onUp);
        return function() { window.removeEventListener("mousemove", onMove); window.removeEventListener("mouseup", onUp); };
      }, [isDragging, dragState, viewEnd, viewStart, totalSpan, projectStart, projectEnd, categories.length]);

      var zoomTo = function(days) {
        if (categories.length === 0) return;
        var span = days * DAY;
        var mid = (viewStart + viewEnd) / 2;
        var s = mid - span / 2;
        var e = mid + span / 2;
        if (s < projectStart) { s = projectStart; e = s + span; }
        if (e > projectEnd) { e = projectEnd; s = e - span; }
        setViewStart(s); setViewEnd(e);
      };

      var ROW_H = 36;
      var HEADER_H = 40;
      var LABEL_W = 200;

      var renderGridLines = function() {
        return monthLines.map(function(m, i) {
          var pct = toPercent(m.ts);
          if (pct < 0 || pct > 100) return null;
          return React.createElement("div", { key: "g" + i, style: { position: "absolute", left: pct + "%", top: 0, bottom: 0, width: 1, background: "#1E2130" } });
        });
      };

      var renderToday = function() {
        if (!showToday) return null;
        return React.createElement("div", { style: { position: "absolute", left: todayPct + "%", top: 0, bottom: 0, width: 2, background: "#FF6B6B", opacity: 0.5, zIndex: 2 } });
      };

      return React.createElement("div", { style: { fontFamily: "'IBM Plex Sans', 'SF Pro Text', -apple-system, sans-serif", background: "#0F1117", color: "#E0E0E6", minHeight: "100vh", padding: "24px" } },

        // Header
        React.createElement("div", { style: { display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 20 } },
          React.createElement("div", null,
            React.createElement("h1", { style: { margin: 0, fontSize: 22, fontWeight: 700, color: "#F5F5F7", letterSpacing: "-0.02em" } }, "Project Schedule"),
            React.createElement("p", { style: { margin: "4px 0 0", fontSize: 13, color: loadingError ? "#FF6B6B" : "#6B6F80" } }, 
              categories.length ? fmtDate(projectStart) + " \u2014 " + fmtDate(projectEnd) : (loadingError || "Loading schedules...")
            )
          ),
          React.createElement("div", { style: { display: "flex", gap: 6, alignItems: "center" } },
            [{ label: "1M", days: 30 }, { label: "3M", days: 90 }, { label: "All", days: 0 }].map(function(z) {
              return React.createElement("button", {
                key: z.label,
                style: { padding: "5px 14px", fontSize: 12, fontWeight: 600, background: "#1A1D28", color: "#A0A4B4", border: "1px solid #2A2D3A", borderRadius: 6, cursor: "pointer", opacity: categories.length ? 1 : 0.5 },
                onClick: function() { z.label === "All" ? (setViewStart(projectStart), setViewEnd(projectEnd)) : zoomTo(z.days); },
                onMouseEnter: function(e) { if(categories.length) { e.target.style.background = "#242838"; e.target.style.color = "#E0E0E6"; } },
                onMouseLeave: function(e) { if(categories.length) { e.target.style.background = "#1A1D28"; e.target.style.color = "#A0A4B4"; } },
                disabled: categories.length === 0
              }, z.label);
            })
          )
        ),

        // Chart container
        React.createElement("div", { style: { background: "#14161E", borderRadius: 10, border: "1px solid #1E2130", overflow: "hidden" } },

          // Month header
          React.createElement("div", { style: { display: "flex", borderBottom: "1px solid #1E2130" } },
            React.createElement("div", { style: { width: LABEL_W, minWidth: LABEL_W, borderRight: "1px solid #1E2130", padding: "10px 16px", fontSize: 11, fontWeight: 600, color: "#5A5E70", textTransform: "uppercase", letterSpacing: "0.06em" } }, "Work Stream"),
            React.createElement("div", { style: { flex: 1, position: "relative", height: 36, overflow: "hidden" } },
              categories.length > 0 && monthLines.map(function(m, i) {
                var pct = toPercent(m.ts);
                if (pct < -10 || pct > 105) return null;
                return React.createElement("div", { key: i, style: { position: "absolute", left: pct + "%", top: 0, height: "100%", display: "flex", alignItems: "center", paddingLeft: 8, fontSize: 11, fontWeight: 500, color: "#5A5E70", whiteSpace: "nowrap" } }, m.label);
              })
            )
          ),

          // Rows
          React.createElement("div", { style: { position: "relative", overflow: "hidden", minHeight: categories.length ? "auto" : "150px" } },
            categories.length === 0 && React.createElement("div", { style: { position: "absolute", top: "50%", left: "50%", transform: "translate(-50%, -50%)", color: "#5A5E70", fontSize: 14 } }, "No data loaded."),
            rows.map(function(row, ri) {
              if (row.type === "header") {
                var cat = row.cat;
                var isCollapsed = collapsed[cat.id];
                return React.createElement("div", {
                  key: cat.id,
                  onClick: function() { toggle(cat.id); },
                  style: { display: "flex", height: HEADER_H, alignItems: "center", cursor: "pointer", borderBottom: "1px solid #1A1D28", background: "#181B25" },
                  onMouseEnter: function(e) { e.currentTarget.style.background = "#1C1F2B"; },
                  onMouseLeave: function(e) { e.currentTarget.style.background = "#181B25"; },
                },
                  React.createElement("div", { style: { width: LABEL_W, minWidth: LABEL_W, borderRight: "1px solid #1E2130", padding: "0 16px", display: "flex", alignItems: "center", gap: 10 } },
                    React.createElement("span", { style: { fontSize: 10, color: "#5A5E70", transition: "transform 0.2s", transform: isCollapsed ? "rotate(-90deg)" : "rotate(0deg)", display: "inline-block" } }, "\u25BC"),
                    React.createElement("span", { style: { width: 10, height: 10, borderRadius: 3, background: cat.color, flexShrink: 0 } }),
                    React.createElement("span", { style: { fontSize: 13, fontWeight: 600, color: "#D0D2DC" } }, cat.label),
                    React.createElement("span", { style: { fontSize: 11, color: "#5A5E70", marginLeft: "auto" } }, cat.owner)
                  ),
                  React.createElement("div", { style: { flex: 1, position: "relative", height: "100%", overflow: "hidden" } },
                    (function() {
                      if (!isCollapsed || cat.tasks.length === 0) return null;
                      var minS = Math.min.apply(null, cat.tasks.map(function(t) { return t.start; }));
                      var maxE = Math.max.apply(null, cat.tasks.map(function(t) { return t.end; }));
                      var geo = barGeo(minS, maxE);
                      if (!geo) return null;
                      return React.createElement("div", { style: { position: "absolute", top: "50%", transform: "translateY(-50%)", left: geo.left + "%", width: geo.width + "%", height: 6, borderRadius: 3, background: cat.color, opacity: 0.35 } });
                    })(),
                    renderGridLines()
                  )
                );
              }

              var task = row.task;
              var cat = row.cat;

              return React.createElement("div", {
                key: cat.id + "-" + ri,
                style: { display: "flex", height: ROW_H, alignItems: "center", borderBottom: "1px solid #16181F", background: ri % 2 === 0 ? "#14161E" : "#15171F" },
                onMouseEnter: function(e) { e.currentTarget.style.background = "#191C26"; },
                onMouseLeave: function(e) { e.currentTarget.style.background = ri % 2 === 0 ? "#14161E" : "#15171F"; },
              },
                React.createElement("div", { style: { width: LABEL_W, minWidth: LABEL_W, borderRight: "1px solid #1E2130", padding: "0 16px 0 42px", fontSize: 12, color: "#8A8EA0", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" } }, task.name),
                React.createElement("div", { style: { flex: 1, position: "relative", height: "100%", overflow: "hidden" } },
                  renderGridLines(),
                  renderToday(),
                  (function() {
                    if (task.milestone) return null;
                    var geo = barGeo(task.start, task.end);
                    if (!geo) return null;
                    return React.createElement("div", {
                      style: { position: "absolute", left: geo.left + "%", width: geo.width + "%", top: "50%", transform: "translateY(-50%)", height: 20, borderRadius: 4, background: "linear-gradient(135deg, " + cat.color + ", " + cat.color + "CC)", zIndex: 3, cursor: "default", boxShadow: "0 1px 4px " + cat.color + "33", transition: "box-shadow 0.15s, height 0.15s" },
                      onMouseEnter: function(e) { e.currentTarget.style.height = "24px"; e.currentTarget.style.boxShadow = "0 2px 10px " + cat.color + "55"; var rect = e.target.getBoundingClientRect(); setTooltip({ x: rect.left + rect.width / 2, y: rect.top - 8, task: task, cat: cat }); },
                      onMouseLeave: function(e) { e.currentTarget.style.height = "20px"; e.currentTarget.style.boxShadow = "0 1px 4px " + cat.color + "33"; setTooltip(null); },
                    },
                      geo.width > 5 ? React.createElement("span", { style: { position: "absolute", left: 8, top: "50%", transform: "translateY(-50%)", fontSize: 10, fontWeight: 500, color: "#fff", whiteSpace: "nowrap", textShadow: "0 1px 2px rgba(0,0,0,0.4)", overflow: "hidden", maxWidth: "calc(100% - 16px)", textOverflow: "ellipsis" } }, task.name) : null
                    );
                  })()
                )
              );
            })
          ),

          // Navigator
          React.createElement("div", { style: { borderTop: "1px solid #1E2130", padding: "12px 16px" } },
            React.createElement("div", {
              ref: navRef,
              onMouseDown: handleNavMouseDown,
              style: { position: "relative", height: 40, background: "#0F1117", borderRadius: 6, cursor: categories.length ? "pointer" : "default", overflow: "hidden", border: "1px solid #1E2130" },
            },
              categories.map(function(cat, ci) {
                return cat.tasks.map(function(t, ti) {
                  var l = navToPercent(t.start);
                  var w = Math.max(0.3, navToPercent(t.end) - l);
                  var ySlot = categories.length > 0 ? (ci / categories.length) * 28 + 4 : 4;
                  return React.createElement("div", { key: cat.id + "-" + ti, style: { position: "absolute", left: l + "%", width: w + "%", top: ySlot, height: 4, borderRadius: 2, background: cat.color, opacity: 0.6 } });
                });
              }),
              categories.length > 0 && React.createElement("div", { style: { position: "absolute", left: navToPercent(viewStart) + "%", width: (navToPercent(viewEnd) - navToPercent(viewStart)) + "%", top: 0, bottom: 0, background: "rgba(255,255,255,0.06)", borderLeft: "2px solid #4A90D9", borderRight: "2px solid #4A90D9", borderRadius: 4 } }),
              categories.length > 0 && now >= projectStart && now <= projectEnd ? React.createElement("div", { style: { position: "absolute", left: navToPercent(now) + "%", top: 0, bottom: 0, width: 2, background: "#FF6B6B", opacity: 0.6 } }) : null
            )
          )
        ),

        // Legend
        React.createElement("div", { style: { display: "flex", flexWrap: "wrap", gap: 16, marginTop: 16, padding: "0 4px" } },
          categories.map(function(cat) {
            return React.createElement("div", { key: cat.id, style: { display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: "#6B6F80" } },
              React.createElement("span", { style: { width: 8, height: 8, borderRadius: 2, background: cat.color } }),
              cat.label
            );
          }),
          categories.length > 0 && React.createElement("div", { style: { display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: "#6B6F80" } },
            React.createElement("span", { style: { width: 8, height: 2, background: "#FF6B6B", borderRadius: 1 } }),
            "Today"
          )
        ),

        // Tooltip
        tooltip ? React.createElement("div", {
          style: { position: "fixed", left: tooltip.x, top: tooltip.y, transform: "translate(-50%, -100%)", background: "#1E2130", border: "1px solid #2A2D3A", borderRadius: 8, padding: "10px 14px", zIndex: 999, pointerEvents: "none", boxShadow: "0 8px 24px rgba(0,0,0,0.4)", minWidth: 160 },
        },
          React.createElement("div", { style: { fontSize: 12, fontWeight: 600, color: "#F5F5F7", marginBottom: 4 } }, tooltip.task.name),
          React.createElement("div", { style: { fontSize: 11, color: tooltip.cat.color, marginBottom: 2 } }, tooltip.cat.label + " \u00B7 " + tooltip.cat.owner),
          React.createElement("div", { style: { fontSize: 11, color: "#6B6F80" } },
            fmtRange(tooltip.task.start, tooltip.task.end) + (!tooltip.task.milestone ? " \u00B7 " + daysCount(tooltip.task.start, tooltip.task.end) + "d" : " \u00B7 Milestone")
          )
        ) : null
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(GanttChart));
  </script>
</body>
</html>
