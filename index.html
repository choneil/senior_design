<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>System Architecture Gantt Chart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/frappe-gantt/0.6.1/frappe-gantt.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/frappe-gantt/0.6.1/frappe-gantt.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; }
        .container { 
            background: #fff; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            max-width: 1200px;
            margin: auto;
        }
        .controls { margin-bottom: 20px; }
        .controls button {
            padding: 10px 20px;
            background: #0071A4;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 10px;
        }
        /* Lock the chart area to a scrollable height */
        .gantt-wrapper {
            height: 600px;
            overflow-y: auto;
            border: 1px solid #eee;
        }
        /* Make the bars look professional */
        .gantt .bar-label { fill: #333; font-weight: 400; }
        .gantt .bar-progress { fill: #a3a3ff; }
    </style>
</head>
<body>

<div class="container">
    <h2>Project Schedule: April - Nov 2026</h2>
    
    <div class="controls">
        <button onclick="changeView('Day')">Day View</button>
        <button onclick="changeView('Week')">Week View</button>
        <button onclick="changeView('Month')">Month View</button>
    </div>

    <div class="gantt-wrapper">
        <svg id="gantt"></svg>
    </div>
</div>

<script>
    const tasks = [
        // --- CHUCK: SOLDER DISPENSING ---
        { id: 's1', name: 'Solder: Contact suppliers', start: '2026-04-06', end: '2026-04-12', progress: 0 },
        { id: 's2', name: 'Solder: Machining tolerances', start: '2026-04-13', end: '2026-04-19', progress: 0 },
        { id: 's3', name: 'Solder: Spec screw/motor', start: '2026-04-20', end: '2026-04-26', progress: 0 },
        { id: 's4', name: 'Solder: Source components', start: '2026-04-27', end: '2026-05-03', progress: 0 },
        { id: 's5', name: 'Solder: Finals Week Buffer', start: '2026-05-04', end: '2026-05-10', progress: 0 },
        { id: 's6', name: 'Solder: Draft prototype', start: '2026-05-11', end: '2026-05-17', progress: 0 },
        { id: 's7', name: 'Solder: Print prototype', start: '2026-05-18', end: '2026-05-24', progress: 0 },
        { id: 's8', name: 'Solder: Design mounting', start: '2026-05-25', end: '2026-05-31', progress: 0 },
        { id: 's9', name: 'Solder: Air system design', start: '2026-06-01', end: '2026-06-07', progress: 0 },
        { id: 's10', name: 'Solder: Pressure testing', start: '2026-06-08', end: '2026-06-21', progress: 0 },
        { id: 's11', name: 'Solder: Assemble mock-up', start: '2026-06-22', end: '2026-06-28', progress: 0 },
        { id: 's12', name: 'Solder: Delivery testing', start: '2026-06-29', end: '2026-07-05', progress: 0 },
        { id: 's13', name: 'Solder: Prototype testing', start: '2026-07-06', end: '2026-07-26', progress: 0 },
        { id: 's14', name: 'Solder: Final Assembly Prep', start: '2026-07-27', end: '2026-08-02', progress: 0 },
        { id: 's15', name: 'Solder: Assemble auger', start: '2026-08-03', end: '2026-08-09', progress: 0 },
        { id: 's16', name: 'Solder: Mount design', start: '2026-08-10', end: '2026-08-16', progress: 0 },
        { id: 's17', name: 'Solder: Function check', start: '2026-08-17', end: '2026-08-23', progress: 0 },
        { id: 's18', name: 'Solder: Basic delivery test', start: '2026-08-24', end: '2026-09-06', progress: 0 },
        { id: 's19', name: 'Solder: Buffer period', start: '2026-09-07', end: '2026-10-04', progress: 0 },
        { id: 's20', name: 'Solder: Optimize speed', start: '2026-10-05', end: '2026-11-01', progress: 0 },
        { id: 's21', name: 'Solder: Dot precision tuning', start: '2026-11-02', end: '2026-11-29', progress: 0 },

        // --- ANDY: FILE HANDLING ---
        { id: 'a1', name: 'Andy: Architecture', start: '2026-04-06', end: '2026-06-15', progress: 0 },
        { id: 'a2', name: 'Andy: Parser Implementation', start: '2026-06-16', end: '2026-11-30', progress: 0 },

        // --- AMAR: COMPONENT DISPENSING ---
        { id: 'm1', name: 'Amar: Dispenser Prototyping', start: '2026-04-06', end: '2026-06-15', progress: 0 },
        { id: 'm2', name: 'Amar: Feeder Integration', start: '2026-06-16', end: '2026-11-30', progress: 0 },

        // --- AINAAN: GANTRY ---
        { id: 'n1', name: 'Ainaan: Rail Installation', start: '2026-04-06', end: '2026-06-15', progress: 0 },
        { id: 'n2', name: 'Ainaan: Calibration/Software', start: '2026-06-16', end: '2026-11-30', progress: 0 },

        // --- GENERAL SYSTEMS ---
        { id: 'g1', name: 'PSU Build & Test', start: '2026-04-06', end: '2026-11-30', progress: 0 },
        { id: 'g2', name: 'PCB Schematic & Fab', start: '2026-04-06', end: '2026-11-30', progress: 0 },
        { id: 'g3', name: 'Heated Bed Systems', start: '2026-04-06', end: '2026-11-30', progress: 0 }
    ];

    const gantt = new Gantt("#gantt", tasks, {
        header_height: 50,
        column_width: 30,
        step: 24,
        view_modes: ['Day', 'Week', 'Month'],
        bar_height: 25,
        bar_corner_radius: 3,
        arrow_curve: 5,
        padding: 18,
        view_mode: 'Week',
        custom_popup_html: function(task) {
            return `
                <div class="details-container">
                    <h5>${task.name}</h5>
                    <p>Expected finish: ${task.end}</p>
                </div>
            `;
        }
    });

    function changeView(mode) {
        gantt.change_view_mode(mode);
    }
</script>

</body>
</html>
